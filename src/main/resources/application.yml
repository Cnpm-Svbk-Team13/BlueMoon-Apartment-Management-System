spring:
  application:
    name: bluemoon-bfms

  datasource:
    # URL kết nối: Ưu tiên lấy từ biến môi trường DB_URL (dành cho Cloud SQL / GCP VM)
    # Mặc định fallback về PostgreSQL localhost
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bluemoon}
    username: ${DB_USERNAME:bluemoon_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema do database/schema.sql quản lý; Hibernate chỉ xác minh Entity.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
