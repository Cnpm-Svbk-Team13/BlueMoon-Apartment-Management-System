<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="messages" class="flash-messages" aria-live="polite">
    <div th:if="${successMessage}"
         class="flash-message flash-success"
         role="status">
        <span class="flash-icon" aria-hidden="true">✓</span>
        <p th:text="${successMessage}">Thao tác thành công.</p>
    </div>

    <div th:if="${errorMessage}"
         class="flash-message flash-error"
         role="alert">
        <span class="flash-icon" aria-hidden="true">!</span>
        <p th:text="${errorMessage}">Đã xảy ra lỗi.</p>
    </div>
</div>
</body>
</html>
