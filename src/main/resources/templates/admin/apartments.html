<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apartments | BlueMoon</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="main-panel">
        <header th:replace="~{fragments/layout :: header}"></header>

        <main class="content">
            <h1>Apartments</h1>
            <div th:replace="~{fragments/flash-messages :: messages}"></div>
            <a th:href="@{/admin/apartments/new}">Create apartment</a>
            <form method="get" th:action="@{/admin/apartments}">
                <label for="floor">Floor</label>
                <input id="floor" name="floor" type="number" min="1" max="30" th:value="${floor}">
                <button type="submit">Filter</button>
                <a th:href="@{/admin/apartments}">Clear filter</a>
            </form>
            <p th:if="${#lists.isEmpty(apartments)}">No apartments found.</p>
            <table th:unless="${#lists.isEmpty(apartments)}">
                <thead><tr><th>Room</th><th>Floor</th><th>Area (m²)</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="apartment : ${apartments}">
                    <td th:text="${apartment.roomNumber}"></td>
                    <td th:text="${apartment.floorNumber}"></td>
                    <td th:text="${apartment.areaSqm}"></td>
                    <td th:text="${apartment.apartmentType}"></td>
                    <td th:text="${apartment.status}"></td>
                    <td>
                        <a th:href="@{/admin/apartments/{id}/edit(id=${apartment.id})}">Edit</a>
                        <a th:href="@{/admin/apartments/{id}/household(id=${apartment.id})}">Household</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </main>
    </div>
</div>
</body>
</html>
