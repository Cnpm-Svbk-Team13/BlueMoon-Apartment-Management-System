<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu | BlueMoon</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="main-panel">
        <header th:replace="~{fragments/layout :: header}"></header>

        <main class="content">
            <div th:replace="~{fragments/flash-messages :: messages}"></div>

            <div class="page-heading">
                <div>
                    <p class="eyebrow">TÀI KHOẢN CỦA TÔI · BẢO MẬT</p>
                    <h2>Đổi mật khẩu</h2>
                    <p class="muted">Xác nhận mật khẩu hiện tại trước khi đặt mật khẩu mới.</p>
                </div>
            </div>

            <section class="form-panel password-panel">
                <form method="post" th:action="@{/admin/users/change-password}"
                      class="account-form" data-password-form>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="form-section-heading">
                        <h3>Cập nhật mật khẩu</h3>
                        <p class="muted">Mật khẩu mới cần có ít nhất 8 ký tự.</p>
                    </div>

                    <div class="password-fields">
                        <div class="form-field">
                            <label for="currentPassword">Mật khẩu hiện tại <span>*</span></label>
                            <input id="currentPassword" name="currentPassword" type="password"
                                   required autocomplete="current-password">
                        </div>

                        <div class="form-field">
                            <label for="newPassword">Mật khẩu mới <span>*</span></label>
                            <input id="newPassword" name="newPassword" type="password"
                                   required minlength="8" maxlength="72"
                                   autocomplete="new-password" data-password-input>
                        </div>

                        <div class="form-field">
                            <label for="confirmPassword">Nhập lại mật khẩu mới <span>*</span></label>
                            <input id="confirmPassword" name="confirmPassword" type="password"
                                   required minlength="8" maxlength="72"
                                   autocomplete="new-password" data-password-confirm>
                            <small class="field-error" data-password-error hidden>
                                Hai mật khẩu mới chưa khớp.
                            </small>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a class="button button-quiet" th:href="@{/admin/apartments}">Hủy</a>
                        <button class="button button-primary" type="submit">Cập nhật mật khẩu</button>
                    </div>
                </form>
            </section>

            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </main>
    </div>
</div>
</body>
</html>
