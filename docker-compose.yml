services:
  postgres:
    image: postgres:17-alpine
    container_name: bluemoon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bluemoon
      POSTGRES_USER: ${POSTGRES_OWNER_USERNAME:-bluemoon_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
